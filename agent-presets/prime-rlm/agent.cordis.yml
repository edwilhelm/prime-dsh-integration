# The `prime-rlm` agent preset: Prime Agent's RLM loop expressed in dsh's own
# language (plan v3 §4.2, §4.10). The heavy lifting is composition:
#
#   - `tool-presentation` (dsh's agent-plane row) flips this preset's tool
#     surface to Code Mode: the model sees run_code + a generated SDK instead
#     of one schema per tool. `both` keeps native schemas visible too, so
#     python_exec stays directly callable; flip to `code` once validated.
#   - The persistent Python kernel and retrieval helpers are host-plane rows
#     of the prime profiles; this preset only selects how they are presented.
#   - Sessions naming any OTHER preset on a prime profile keep stock behavior:
#     RLM is opt-in per agent, never an ideological default (P13).
#
# This file is an AGENT-PLANE composition mounted ONCE under a standing scope;
# every session naming it joins by scope parentage.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working
      directory is {{cwd}}. You work in a programmatic loop: prefer writing a
      short program that calls several tools over many round-trips, and keep
      durable state in the persistent Python kernel instead of re-deriving it.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── presentation: Code Mode + native kernel access ──────────────────────────

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    # `both`: run_code SDK AND native schemas. Flip to `code` for pure Code
    # Mode once the Phase-3 validation gate passes for your model route.
    mode: both

# ── shell / filesystem / jobs ───────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals (autonomy rounds) ─────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction (the envelope's durable compactor) ───────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
